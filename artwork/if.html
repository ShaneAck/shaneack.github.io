<main>

  <div class="piece">

    <!-- Video with autoplay -->
    <video class="piece-media" autoplay muted loop playsinline controls>
      <source src="../videos/If.mp4" type="video/mp4">
    </video>

    <!-- EDIT ME: title, year, dimensions, medium -->
    <p class="piece-caption">
      <span class="piece-title">If</span>
      2020<br>
      Video<br>
      4 min 30 sec
    </p>
  </div>

  <!-- Image carousel for flipping through stills -->
  <div class="image-carousel">
    <button class="carousel-btn carousel-prev" onclick="changeImage(-1)">❮</button>
    <div class="carousel-container">
      <img id="carousel-image" src="../images/If 4.1.jpg" alt="If">
    </div>
    <button class="carousel-btn carousel-next" onclick="changeImage(1)">❯</button>
  </div>

  <p class="carousel-counter">
    <span id="current-image">1</span> / <span id="total-images">10</span>
  </p>

  <!-- OPTIONAL: delete this <p> entirely if a piece has no description -->
  <p class="bio">
    Description of the piece goes here.
  </p>

</main>

<footer class="site-footer">
  &copy; <span id="year"></span> Shane Ackerley
</footer>

<script src="../js/nav.js"></script>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  // Image carousel functionality
  const images = [
    '../images/If 4.1.jpg',
    '../images/If 4.2.jpg',
    '../images/If 4.3.jpg',
    '../images/If 4.4.jpg',
    '../images/If 4.5.jpg',
    '../images/If 4.6.jpg',
    '../images/If 4.7.jpg',
    '../images/If 4.8.jpg',
    '../images/If 4.9.jpg',
    '../images/If 4.10.jpg'
  ];

  let currentIndex = 0;

  function changeImage(direction) {
    currentIndex += direction;
    if (currentIndex >= images.length) {
      currentIndex = 0;
    } else if (currentIndex < 0) {
      currentIndex = images.length - 1;
    }
    document.getElementById('carousel-image').src = images[currentIndex];
    document.getElementById('current-image').textContent = currentIndex + 1;
  }
</script>

</body>
</html>
